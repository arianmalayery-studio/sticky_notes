{% extends 'base.html' %}
{% block title %}Sticky Notes - {{ note.title }}{% endblock %}
{% block content %}
  <div class="note note-large">
    <h2>{{ note.title }}</h2>
    <p>{{ note.content|linebreaksbr }}</p>
    <small>Created: {{ note.created_at }} | Updated: {{ note.updated_at }}</small>
  </div>
  <div class="button-row">
    <form action="{% url 'note_update' pk=note.pk %}" method="get" class="inline-form">
      <button type="submit" class="btn">Edit</button>
    </form>
    <form action="{% url 'note_delete' pk=note.pk %}" method="get" class="inline-form">
      <button type="submit" class="btn btn-danger">Delete</button>
    </form>
    <form action="{% url 'note_list' %}" method="get" class="inline-form">
      <button type="submit" class="btn btn-secondary">Back</button>
    </form>
  </div>
{% endblock %}
